


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCA Vault</title>
  <style>
  /* Reset & Box Sizing */
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
  }

  body {
    background: linear-gradient(135deg, #1a0003 0%, #4a040d 50%, #800020 100%);
    background-attachment: fixed; /* Keeps background smooth on mobile scroll */
    min-height: 100vh;
    color: #fff;
    padding: 20px 12px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Glassmorphism Container */
  .glass-container {
    background: rgba(128, 0, 32, 0.25);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    border-radius: 20px;
    width: 100%;
    max-width: 900px;
    padding: 24px;
  }

  /* Typography */
  h1 { 
    font-size: clamp(1.5rem, 4vw, 2.2rem); 
    margin-bottom: 12px; 
    font-weight: 600; 
    text-shadow: 0 2px 4px rgba(0,0,0,0.3); 
    word-break: break-word;
  }
  
  h2 { 
    font-size: clamp(1.1rem, 3vw, 1.3rem); 
    margin-bottom: 16px; 
    font-weight: 500; 
    opacity: 0.9;
  }

  h3 {
    font-size: 1.2rem;
  }

  /* Nav / Controls */
  .btn-back {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 20px;
    font-size: 0.95rem;
    transition: background 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px; /* Optimal tap target size */
  }
  .btn-back:hover { background: rgba(255, 255, 255, 0.3); }

  /* Cards Grid - Auto-fit for fluid responsiveness */
  .grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
    gap: 15px; 
    margin-top: 15px; 
  }
  
  .card {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 20px 15px;
    text-align: center;
    cursor: pointer;
    font-weight: 500;
    transition: transform 0.2s, background 0.3s;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .card:hover {
    background: rgba(255, 255, 255, 0.18);
    transform: translateY(-3px);
  }

  /* Modules Accordion & List */
  .module-list { 
    display: flex; 
    flex-direction: column; 
    gap: 12px; 
    margin-top: 15px; 
  }
  
  .module-card {
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 16px;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .module-card:hover { background: rgba(0, 0, 0, 0.35); }

  .module-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    font-weight: bold; 
    gap: 10px;
  }
  
  .badge-lock { color: #ff8080; font-weight: normal; font-size: 0.85rem; white-space: nowrap; }
  .badge-unlocked { color: #80ffaa; font-weight: normal; font-size: 0.85rem; white-space: nowrap; }

  /* Accordion Drawer */
  .accordion-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out, margin-top 0.3s, padding-top 0.3s;
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.4;
    border-top: 0px solid transparent;
  }
  .module-card.expanded .accordion-content {
    max-height: 300px; /* Expanded capacity for longer module text */
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
  }

  /* Download Page Styling */
  .download-box {
    background: rgba(0, 0, 0, 0.3);
    padding: 24px 16px;
    border-radius: 12px;
    margin-top: 15px;
    text-align: center;
  }
  
  .btn-download {
    display: inline-block;
    margin-top: 18px;
    background: #ff2e4c;
    color: white;
    padding: 12px 24px;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: background 0.2s, transform 0.2s;
    width: 100%;
    max-width: 250px;
    box-shadow: 0 4px 12px rgba(255, 46, 76, 0.3);
  }
  .btn-download:hover { 
    background: #ff0026; 
    transform: translateY(-2px);
  }

  /* Hidden View Helper */
  .hidden { display: none; }

  /* Responsive Media Queries */
  @media (min-width: 480px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }
  }

  @media (max-width: 600px) {
    body {
      padding: 12px 8px;
    }

    .glass-container {
      padding: 16px;
      border-radius: 14px;
    }

    .btn-download {
      width: 100%; /* Full width button on small mobile screens */
    }
  }
</style>
</head>
<body>

  <div class="glass-container">

    <!-- VIEW 1: SEMESTERS -->
    <div id="view-semesters">
      <h1>MCA Course Vault</h1>
      <h2>Select Semester</h2>
      <div class="grid">
        <div class="card" onclick="openSemester(1)">Semester 1</div>
        <div class="card" onclick="openSemester(2)">Semester 2</div>
        <div class="card" onclick="openSemester(3)">Semester 3</div>
        <div class="card" onclick="openSemester(4)">Semester 4</div>
      </div>
    </div>

    <!-- VIEW 2: PAPERS -->
    <div id="view-papers" class="hidden">
      <button class="btn-back" onclick="showView('view-semesters')">← Back to Semesters</button>
      <h1 id="paper-sem-title">Semester</h1>
      <h2>Select Subject Paper</h2>
      <div id="papers-grid" class="grid"></div>
    </div>

    <!-- VIEW 3: MODULES -->
    <div id="view-modules" class="hidden">
      <button class="btn-back" onclick="showView('view-papers')">← Back to Papers</button>
      <h1 id="module-paper-title">Subject</h1>
      <h2>Select Module</h2>
      <div id="modules-list" class="module-list"></div>
    </div>

    <!-- VIEW 4: UNLOCKED MODULE VIEW -->
    <div id="view-pdf" class="hidden">
      <button class="btn-back" onclick="showView('view-modules')">← Back to Modules</button>
      <h1 id="pdf-module-title">Module Title</h1>
      <div class="download-box">
        <h3>Syllabus Overview</h3>
        <p id="pdf-overview-text" style="margin-top: 10px; color: rgba(255,255,255,0.8);"></p>
        <a id="download-link" href="#" download class="btn-download">Download PDF</a>
      </div>
    </div>

  </div>

  <script>
    // Data Structure setup
    const courseData = {
      1: {
        "DBMS": [
          { name: "Module 1", overview: "Introduction to Database Concepts, ER Modeling.", pdf: "pdfs/dbms_mod1.pdf" },
          { name: "Module 2", overview: "Relational Model & Relational Algebra.", pdf: null },
          { name: "Module 3", overview: "SQL Queries and Constraints.", pdf: null },
          { name: "Module 4", overview: "Normalization and Database Design.", pdf: null },
          { name: "Module 5", overview: "Transaction Management & Concurrency Control.", pdf: null }
        ],
        "DMS": generateModules("DMS"),
        "DLD": generateModules("DLD"),
        "CN": generateModules("CN"),
        "PPL": generateModules("PPL"),
        "ENG": generateModules("ENG")
      },
      2: { "Paper 1": generateModules("Paper 1"), "Paper 2": generateModules("Paper 2"), "Paper 3": generateModules("Paper 3"), "Paper 4": generateModules("Paper 4") },
      3: { "Paper 1": generateModules("Paper 1"), "Paper 2": generateModules("Paper 2"), "Paper 3": generateModules("Paper 3"), "Paper 4": generateModules("Paper 4") },
      4: { "Paper 1": generateModules("Paper 1"), "Paper 2": generateModules("Paper 2"), "Paper 3": generateModules("Paper 3"), "Paper 4": generateModules("Paper 4") }
    };

    // Helper function to dynamically create 5 default locked modules
    function generateModules(subject) {
      let mods = [];
      for (let i = 1; i <= 5; i++) {
        mods.push({
          name: `Module ${i}`,
          overview: `${subject} Module ${i} syllabus overview details go here...`,
          pdf: null
        });
      }
      return mods;
    }

    let currentSem = null;
    let currentPaper = null;

    function showView(viewId) {
      document.querySelectorAll('.glass-container > div').forEach(div => div.classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
    }

    function openSemester(semNumber) {
      currentSem = semNumber;
      document.getElementById('paper-sem-title').innerText = `Semester ${semNumber}`;
      
      const grid = document.getElementById('papers-grid');
      grid.innerHTML = '';

      Object.keys(courseData[semNumber]).forEach(paperName => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerText = paperName;
        card.onclick = () => openPaper(paperName);
        grid.appendChild(card);
      });

      showView('view-papers');
    }

    function openPaper(paperName) {
      currentPaper = paperName;
      document.getElementById('module-paper-title').innerText = paperName;

      const list = document.getElementById('modules-list');
      list.innerHTML = '';

      const modules = courseData[currentSem][paperName];

      modules.forEach((mod, index) => {
        const modCard = document.createElement('div');
        modCard.className = 'module-card';
        
        const isUnlocked = Boolean(mod.pdf);
        const badge = isUnlocked ? `<span class="badge-unlocked">✔ Unlocked</span>` : `<span class="badge-lock">🔒 Locked</span>`;

        modCard.innerHTML = `
          <div class="module-header">
            <span>${mod.name}</span>
            ${badge}
          </div>
          <div class="accordion-content">
            <p>${mod.overview}</p>
          </div>
        `;

        modCard.onclick = (e) => {
          if (isUnlocked) {
            openPdfView(mod);
          } else {
            // Toggle accordion expansion if locked
            modCard.classList.toggle('expanded');
          }
        };

        list.appendChild(modCard);
      });

      showView('view-modules');
    }

    function openPdfView(moduleObj) {
      document.getElementById('pdf-module-title').innerText = moduleObj.name;
      document.getElementById('pdf-overview-text').innerText = moduleObj.overview;
      document.getElementById('download-link').href = moduleObj.pdf;
      showView('view-pdf');
    }
  </script>

</body>
</html>
